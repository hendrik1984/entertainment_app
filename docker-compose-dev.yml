services:
  web:
    build:
      context: .
      dockerfile: Dockerfile-development
    container_name: entertainment_app_web
    volumes:
      - ".:/app"
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: entertainment_app_development
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:18
    container_name: entertainment_app_db
    environment:
      POSTGRES_DB: entertainment_app_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: